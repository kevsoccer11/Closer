<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Closer: Couples Connection & Intimacy Game</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#08080a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Closer">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2589/2589175.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2589/2589175.png" type="image/png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>

<body>
    <!-- Ambient Glow Background -->
    <div class="ambient-bg" id="ambientBg"></div>

    <!-- Header -->
    <header>
        <div class="top-bar">
            <div class="app-title"><i data-lucide="heart" class="brand-heart"></i> Closer</div>
            <div class="header-actions">
                <button class="icon-btn" id="pairPartnerBtn" title="Pair Partner (Realtime Room)"><i
                        data-lucide="radio"></i></button>
                <button class="icon-btn" id="userProfileBtn" title="User Profile"><i data-lucide="user"></i></button>
                <button class="icon-btn" id="journalDrawerBtn" title="Date Night Journal"><i
                        data-lucide="book-heart"></i></button>
                <button class="icon-btn" id="favsDrawerBtn" title="Favorites"><i data-lucide="bookmark"></i></button>
                <button class="icon-btn" id="toolsDrawerBtn" title="Tools & Database"><i
                        data-lucide="sliders"></i></button>
            </div>
        </div>

        <!-- Module Navigation -->
        <div class="module-nav">
            <button class="module-tab active" data-module="sexuality"><i data-lucide="flame"></i> Sexuality</button>
            <button class="module-tab" data-module="life"><i data-lucide="compass"></i> Life</button>
            <button class="module-tab" data-module="secrets"><i data-lucide="key-round"></i> Secrets</button>
        </div>

        <!-- Intensity Selector -->
        <div class="intensity-bar" id="intensityBar">
            <button class="intensity-btn active" data-level="all">All Levels</button>
            <button class="intensity-btn" data-level="1">Mild (Lvl 1)</button>
            <button class="intensity-btn" data-level="2">Moderate (Lvl 2)</button>
            <button class="intensity-btn" data-level="3">Wild (Lvl 3)</button>
        </div>

        <!-- Actions Row -->
        <div class="action-row">
            <button class="shuffle-all-btn" id="shuffleAllBtn"><i data-lucide="shuffle"></i> Shuffle All</button>
            <button class="add-card-btn" id="openAddCardModal"><i data-lucide="plus-circle"></i> Add Question</button>
        </div>
    </header>

    <!-- Card Stage -->
    <main>
        <div class="card-container" id="cardContainer">
            <div class="card-header">
                <span class="card-badge" id="cardCategory">Loading Deck...</span>
                <div class="card-actions">
                    <button class="card-action-btn" id="favCardBtn" title="Bookmark"><i
                            data-lucide="bookmark"></i></button>
                </div>
            </div>

            <div class="card-body">
                <p class="card-prompt" id="cardPrompt">Connecting to Closer deck...</p>

                <div class="timer-bar hidden" id="actionTimerBar">
                    <div>
                        <span style="font-size:0.75rem; color:var(--text-muted); display:block;">Action Timer</span>
                        <span class="timer-display" id="timerClock">01:00</span>
                    </div>
                    <button class="timer-btn" id="timerToggleBtn">Start</button>
                </div>
            </div>

            <div class="card-footer">
                <span id="deckCounter">Card 0 of 0</span>
                <span class="tap-hint"><i data-lucide="touch-portal"></i> Tap card for next</span>
            </div>
        </div>
    </main>

    <!-- Response Section -->
    <div class="response-section">
        <div class="response-bar" id="responseBar"></div>
    </div>

    <!-- Custom Question Modal -->
    <div class="modal-overlay hidden" id="customCardModal">
        <div class="modal-card">
            <h3>Add Custom Question</h3>
            <div class="modal-form">
                <label>Target Module</label>
                <select id="customModule">
                    <option value="sexuality">Sexuality & Intimacy</option>
                    <option value="life">Life & Future</option>
                    <option value="secrets">Secrets & Desires</option>
                </select>

                <label>Category Name</label>
                <input type="text" id="customCategory" placeholder="e.g. Past History, Desires" />

                <label>Intensity Level</label>
                <select id="customIntensity">
                    <option value="1">Level 1 - Mild</option>
                    <option value="2">Level 2 - Moderate</option>
                    <option value="3">Level 3 - Wild</option>
                </select>

                <label>Question Prompt</label>
                <textarea id="customPrompt" placeholder="Type your prompt or question here..." rows="4"></textarea>
            </div>
            <div class="modal-actions">
                <button id="closeModalBtn" class="btn-secondary">Cancel</button>
                <button id="saveCustomCardBtn" class="btn-primary">Save to Database</button>
            </div>
        </div>
    </div>

    <!-- Project Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Closer Service Worker active:', reg.scope))
                    .catch(err => console.warn('Service Worker registration failed:', err));
            });
        }
    </script>
</body>

</html>
